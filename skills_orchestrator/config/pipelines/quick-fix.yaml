id: quick-fix
name: 快速修复
description: 小型修复进度协调流程，跳过规划和审查；不用于发布审批
profile: coordination
steps:
  - id: debug
    skill: systematic-debugging
    next: [fix]
    gate:
      must_produce: root_cause

  - id: fix
    skill: tdd
    next: [commit]
    gate:
      must_produce: code_changes

  - id: commit
    skill: git-commit-conventions
    next: []
    gate:
      must_produce: commit_sha
