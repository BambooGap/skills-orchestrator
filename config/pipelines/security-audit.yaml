id: security-audit
name: 安全审查流程
description: 审查任务进度协调流程；不表示已通过合并、发布或部署审批
profile: coordination
steps:
  - id: code-review
    skill: pr-review
    next: [security-check]
    gate:
      must_produce: review_feedback

  - id: security-check
    skill: security-review
    next: [finish]
    gate:
      must_produce: security_findings
      min_length: 200

  - id: finish
    skill: finish-branch
    next: []
    gate:
      must_produce: merge_confirmation
