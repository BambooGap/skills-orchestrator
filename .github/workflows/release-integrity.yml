name: Release Integrity

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-public-artifacts:
    name: Verify public artifacts and evidence
    uses: ./.github/workflows/post-release-smoke.yml
    with:
      version: ${{ github.event.release.tag_name || inputs.version }}
      full_smoke: true
      retries: "30"
      retry_delay: "30"
    secrets: inherit

  attach-release-evidence:
    name: Retain release verification evidence
    needs: verify-public-artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download smoke report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: post-release-smoke-${{ github.event.release.tag_name || inputs.version }}

      - name: Create report checksum
        shell: bash
        run: sha256sum post-release-smoke.json > post-release-smoke.sha256

      - name: Attest release verification evidence
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            post-release-smoke.json
            post-release-smoke.sha256

      - name: Attach durable evidence to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          gh release upload "$TAG" \
            post-release-smoke.json \
            post-release-smoke.sha256
