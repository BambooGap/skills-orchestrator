name: Release Integrity

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-public-artifacts:
    name: Verify public artifacts and evidence
    uses: ./.github/workflows/post-release-smoke.yml
    with:
      version: ${{ github.event.release.tag_name }}
      full_smoke: true
      retries: "30"
      retry_delay: "30"
    secrets: inherit
