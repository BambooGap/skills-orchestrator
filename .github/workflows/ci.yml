name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Ruff lint
        run: ruff check skills_orchestrator/ tests/

      - name: Ruff format check
        run: ruff format --check skills_orchestrator/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Validate skills config
        run: skills-orchestrator validate --config config/skills.yaml

      - name: CLI smoke checks
        run: |
          skills-orchestrator --help
          skills-orchestrator init --help
          skills-orchestrator mcp-test --help
          skills-orchestrator manifest --config config/skills.yaml --format json | python -m json.tool >/dev/null
          skills-orchestrator manifest --config config/skills.yaml --format cyclonedx | python -m json.tool >/dev/null
          skills-orchestrator policy export --config config/skills.yaml --format opa-input | python -m json.tool >/dev/null
          skills-orchestrator policy export --config config/skills.yaml --format rego-test >/dev/null
          skills-orchestrator adapters inspect --format json | python -m json.tool >/dev/null
          skills-orchestrator adapters export mcp-client-config --config config/skills.yaml | python -m json.tool >/dev/null
          skills-orchestrator adapters export openai-agents-sdk --config config/skills.yaml > /tmp/openai_skillops_agent.py
          python -m py_compile /tmp/openai_skillops_agent.py
          skills-orchestrator supply-chain sbom --no-dependencies | python -m json.tool >/dev/null
          skills-orchestrator supply-chain container-release \
            --image ghcr.io/bamboogap/skills-orchestrator \
            --tag smoke \
            --digest sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --sbom-output /tmp/container-sbom.cdx.json \
            --provenance-output /tmp/container-provenance.json \
            --no-dependencies
          skills-orchestrator schema validate --kind container-provenance --input /tmp/container-provenance.json
          mkdir -p .skills-audit
          skills-orchestrator mcp-test prepare_context '{"task":"release evidence","include_content":false}' --audit-dir .skills-audit >/dev/null
          skills-orchestrator usage report --audit-dir .skills-audit --json | python -m json.tool >/dev/null
          skills-orchestrator schema validate --kind github-app-installation --input examples/commercial-handoff/installation.json
          skills-orchestrator schema validate --kind hosted-registry-ingest --input examples/commercial-handoff/registry-ingest.json
          skills-orchestrator schema validate --kind enterprise-dashboard-snapshot --input examples/commercial-handoff/dashboard-snapshot.json
          skills-orchestrator schema validate --kind enterprise-dashboard-rollup --input examples/commercial-handoff/dashboard-rollup.json
          skills-orchestrator --version

      - name: SkillOps reference repo conformance smoke
        run: |
          mkdir -p /tmp/skillops-reference-evidence
          skills-orchestrator schema validate --kind config --input examples/demo-repo/config/skills.yaml
          skills-orchestrator check \
            --config examples/demo-repo/config/skills.yaml \
            --policy-pack builtin/team-standard \
            --fail-on warning
          skills-orchestrator check \
            --config examples/demo-repo/config/skills.yaml \
            --format sarif \
            > /tmp/skillops-reference-evidence/check.sarif
          skills-orchestrator registry build \
            --config-glob examples/demo-repo/config/skills.yaml \
            --output /tmp/skillops-reference-evidence/registry-before.json
          cp /tmp/skillops-reference-evidence/registry-before.json \
            /tmp/skillops-reference-evidence/registry-after.json
          skills-orchestrator registry diff \
            /tmp/skillops-reference-evidence/registry-before.json \
            /tmp/skillops-reference-evidence/registry-after.json \
            --format json \
            --output /tmp/skillops-reference-evidence/registry-diff.json
          skills-orchestrator registry diff \
            /tmp/skillops-reference-evidence/registry-before.json \
            /tmp/skillops-reference-evidence/registry-after.json \
            --format markdown \
            --output /tmp/skillops-reference-evidence/registry-diff.md
          skills-orchestrator registry comment-body \
            /tmp/skillops-reference-evidence/registry-diff.md \
            --output /tmp/skillops-reference-evidence/registry-diff-comment.md
          skills-orchestrator evidence export \
            --config examples/demo-repo/config/skills.yaml \
            --out /tmp/skillops-reference-evidence
          skills-orchestrator dashboard snapshot \
            --evidence-dir /tmp/skillops-reference-evidence \
            --repository BambooGap/skills-orchestrator \
            --ref "${GITHUB_REF:-refs/heads/main}" \
            --commit "${GITHUB_SHA:-local}" \
            --output /tmp/skillops-reference-evidence/dashboard-snapshot.json
          skills-orchestrator dashboard rollup \
            --snapshot /tmp/skillops-reference-evidence/dashboard-snapshot.json \
            --organization BambooGap \
            --output /tmp/skillops-reference-evidence/dashboard-rollup.json
          skills-orchestrator adapters inspect \
            --path examples/demo-repo \
            --format json \
            > /tmp/skillops-reference-evidence/adapter-inspect.json
          skills-orchestrator schema validate --kind registry --input /tmp/skillops-reference-evidence/registry-before.json
          skills-orchestrator schema validate --kind registry-diff --input /tmp/skillops-reference-evidence/registry-diff.json
          skills-orchestrator schema validate --kind evidence --input /tmp/skillops-reference-evidence/evidence-manifest.json
          skills-orchestrator schema validate --kind enterprise-dashboard-snapshot --input /tmp/skillops-reference-evidence/dashboard-snapshot.json
          skills-orchestrator schema validate --kind enterprise-dashboard-rollup --input /tmp/skillops-reference-evidence/dashboard-rollup.json
          skills-orchestrator schema validate --kind adapter-inspect --input /tmp/skillops-reference-evidence/adapter-inspect.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/skillops-reference-evidence/adapter-inspect.json").read_text())
          expected = {"agents-md", "claude-skills", "mcp-client-config", "openai-agents-sdk"}
          detected = {surface["id"] for surface in data["surfaces"] if surface["detected"]}
          missing = sorted(expected - detected)
          if missing:
              raise SystemExit(f"missing reference adapter surfaces: {missing}")
          PY

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Smoke packaged schema resources
        run: |
          python -m venv /tmp/skills-orchestrator-wheel-smoke
          /tmp/skills-orchestrator-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/skills-orchestrator-wheel-smoke/bin/skills-orchestrator schema list --format json | python -m json.tool >/dev/null
          /tmp/skills-orchestrator-wheel-smoke/bin/skills-orchestrator schema validate --kind config --input config/skills.yaml

  mcp-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            profile: constrained
          - python-version: "3.13"
            profile: constrained
          - python-version: "3.12"
            profile: minimum
          - python-version: "3.12"
            profile: latest
          - python-version: "3.12"
            profile: fastapi-current
          - python-version: "3.12"
            profile: fastapi-old-unsupported

    name: MCP compatibility (${{ matrix.python-version }}, ${{ matrix.profile }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install version-constrained MCP deployment set
        if: matrix.profile == 'constrained'
        run: python -m pip install -c constraints-mcp.txt -e ".[mcp]"

      - name: Install minimum supported MCP
        if: matrix.profile == 'minimum'
        run: PIP_CONSTRAINT=/dev/null python -m pip install -e ".[mcp]" "mcp==1.0.0"

      - name: Install latest compatible MCP 1.x
        if: matrix.profile == 'latest'
        run: PIP_CONSTRAINT=/dev/null python -m pip install -e ".[mcp]" "mcp<2"

      - name: Install current supported FastAPI combination
        if: matrix.profile == 'fastapi-current'
        run: >-
          PIP_CONSTRAINT=/dev/null python -m pip install -e ".[mcp]"
          "mcp<2" "fastapi==0.140.0"

      - name: Confirm old FastAPI shared environment is rejected
        if: matrix.profile == 'fastapi-old-unsupported'
        shell: bash
        run: |
          set -euo pipefail
          PIP_CONSTRAINT=/dev/null python -m pip install "fastapi==0.116.1"
          set +e
          PIP_CONSTRAINT=/dev/null python -m pip install -e ".[mcp]" "mcp<2" \
            > /tmp/old-fastapi-install.txt 2>&1
          install_status=$?
          set -e
          cat /tmp/old-fastapi-install.txt

          classifier_args=(
            --install-status "$install_status"
            --install-log /tmp/old-fastapi-install.txt
          )
          if [ "$install_status" -eq 0 ]; then
            set +e
            python -m pip check > /tmp/old-fastapi-pip-check.txt 2>&1
            check_status=$?
            set -e
            cat /tmp/old-fastapi-pip-check.txt
            classifier_args+=(
              --pip-check-status "$check_status"
              --pip-check-log /tmp/old-fastapi-pip-check.txt
            )
          fi
          python scripts/verify_fastapi_conflict.py "${classifier_args[@]}"

      - name: Verify supported MCP runtime
        if: matrix.profile != 'fastapi-old-unsupported'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          skills-orchestrator mcp-test list_skills '{}' --config config/skills.yaml >/dev/null
          python scripts/report_mcp_versions.py | tee mcp-runtime-versions.json
          skills-orchestrator supply-chain sbom \
            --installed-environment \
            --output mcp-runtime-sbom.cdx.json
          skills-orchestrator schema validate \
            --kind supply-chain-sbom \
            --input mcp-runtime-sbom.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path

          sbom = json.loads(Path("mcp-runtime-sbom.cdx.json").read_text())
          names = {component["name"].lower() for component in sbom["components"]}
          required = {"mcp", "starlette", "sse-starlette"}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"MCP runtime SBOM is missing: {missing}")
          PY

      - name: Verify current FastAPI returns HTTP 200
        if: matrix.profile == 'fastapi-current'
        run: |
          python - <<'PY'
          from fastapi import FastAPI
          from fastapi.testclient import TestClient

          app = FastAPI()

          @app.get("/health")
          def health():
              return {"ok": True}

          response = TestClient(app).get("/health")
          assert response.status_code == 200, response.text
          PY

      - name: Retain MCP compatibility evidence
        if: matrix.profile != 'fastapi-old-unsupported'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-compatibility-${{ matrix.python-version }}-${{ matrix.profile }}
          path: |
            mcp-runtime-versions.json
            mcp-runtime-sbom.cdx.json
          if-no-files-found: error

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run local action
        uses: ./
        with:
          config: config/skills.yaml
          format: text

      - name: Run local action with SARIF output
        uses: ./
        with:
          config: config/skills.yaml
          format: sarif

      - name: Validate SARIF file generation
        run: |
          skills-orchestrator check --config config/skills.yaml --format sarif > skills-orchestrator.sarif
          python -m json.tool skills-orchestrator.sarif >/dev/null

      - name: Validate registry comment body generation
        run: |
          skills-orchestrator registry build --config-glob config/skills.yaml --output registry-base.json
          cp registry-base.json registry-head.json
          skills-orchestrator registry diff registry-base.json registry-head.json --format markdown --output registry-diff.md
          skills-orchestrator registry comment-body registry-diff.md --output registry-diff-comment.md
          grep -F "skills-orchestrator:registry-diff-comment:v1" registry-diff-comment.md

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Check third-party action pinning
        run: python scripts/check_action_pins.py

      - name: Check constrained pip installs
        run: python scripts/check_pip_constraints.py

      - name: Check Docker base image digest pinning
        run: python scripts/check_docker_base_digest.py

      - name: Install package for supply-chain evidence
        run: pip install -c constraints.txt -e .

      - name: Generate package SBOM
        run: |
          skills-orchestrator supply-chain sbom --output package-sbom.cdx.json
          python -m json.tool package-sbom.cdx.json >/dev/null

      - name: Run pip-audit
        run: |
          python -m pip install -c constraints.txt pip-audit
          pip-audit --strict --requirement constraints.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image
        run: docker build -t skills-orchestrator:ci .

      - name: Smoke test Docker image
        run: |
          docker run --rm skills-orchestrator:ci --version
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            skills-orchestrator:ci \
            mcp-test list_skills '{}' --config config/skills.yaml >/dev/null
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            skills-orchestrator:ci \
            manifest --config config/skills.yaml --format json \
            | python -m json.tool >/dev/null
